[package]
name = "chia-monitor-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native GPUI port of the Chia testnet monitor"

[dependencies]
gpui-kit = { version = "0.9.1", default-features = false, features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
